<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#3B82F6" />
  <meta name="color-scheme" content="light dark" />
  <script>
    // 主题预渲染：在首屏绘制前写入 data-theme，避免深浅色切换时白屏闪烁（FOUC）
    (function () {
      try {
        var m = localStorage.getItem('class-manager-theme') || 'system';
        var dark = m === 'dark' || (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
  <title>班级管家 · 高中班主任管理系统</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%232563EB'/%3E%3Cg fill='white'%3E%3Crect x='26' y='26' width='20' height='20' rx='5'/%3E%3Crect x='54' y='26' width='20' height='20' rx='5'/%3E%3Crect x='26' y='54' width='20' height='20' rx='5'/%3E%3Crect x='54' y='54' width='20' height='20' rx='5'/%3E%3C/g%3E%3C/svg%3E" />
  <!-- PWA：安装为独立 App -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="班级管家" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="css/styles.css?v=4" />
</head>
<body>
  <div id="app">
    <!-- 顶部标题栏 -->
    <header class="topbar" id="topbar">
      <div class="topbar-inner">
        <span class="topbar-back hidden" id="topbarBack"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></span>
        <h1 class="topbar-title" id="topbarTitle">班级管家</h1>
        <span class="topbar-action" id="topbarAction"></span>
      </div>
    </header>

    <!-- 视图容器 -->
    <main id="view" class="view"></main>

    <!-- 底部导航 -->
    <nav class="tabbar" id="tabbar">
      <a href="#/dashboard" class="tab" data-tab="dashboard">
        <span class="tab-icon"></span><span class="tab-label">首页</span>
      </a>
      <a href="#/students" class="tab" data-tab="students">
        <span class="tab-icon"></span><span class="tab-label">学生</span>
      </a>
      <a href="#/attendance" class="tab" data-tab="attendance">
        <span class="tab-icon"></span><span class="tab-label">考勤</span>
      </a>
      <a href="#/points" class="tab" data-tab="points">
        <span class="tab-icon"></span><span class="tab-label">积分</span>
      </a>
      <a href="#/more" class="tab" data-tab="more">
        <span class="tab-icon"></span><span class="tab-label">更多</span>
      </a>
    </nav>

    <!-- 全局弹层 -->
    <div class="modal-mask hidden" id="modalMask">
      <div class="modal" id="modalBox"></div>
    </div>

    <!-- Toast -->
    <div class="toast hidden" id="toast"></div>
  </div>

  <script type="module" src="js/app.js?v=4"></script>
  <script>
    // 注册 Service Worker，使 App 可离线使用
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      });
    }
  </script>
</body>
</html>
